 
name: Sapphiren Custom Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE: sapphiren
  ARCH: arm64
  CLANG_VERSION: clang-r450784e
  AOSP_CLANG_COMMIT: 8b0689df9225c41530631f9bd6d7703815f08ae7
  JOBS: "2"

jobs:
  build:
    name: Sapphiren ARM64 Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ======================================
      # 1. CHECKOUT SOURCE
      # ======================================

      - name: Checkout FirstKernel
        uses: actions/checkout@v4
        with:
          ref: FirstKernel
          fetch-depth: 1
          submodules: recursive

      - name: Show Source Information
        run: |
          echo "Device: $DEVICE"
          echo "Architecture: $ARCH"
          echo "Branch: FirstKernel"
          echo "Commit: $(git rev-parse HEAD)"

          echo "Repository structure:"
          ls -lah

      # ======================================
      # 2. INSTALL DEPENDENCIES
      # ======================================

      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libdw-dev \
            lz4 \
            make \
            pahole \
            python3 \
            python3-dev \
            rsync \
            unzip \
            wget \
            zip \
            zstd \
            device-tree-compiler

      - name: Verify Dependencies
        shell: bash
        run: |
          set -e

          echo "===== MAKE ====="
          make --version

          echo "===== PAHOLE ====="
          pahole --version

          PAHOLE_VERSION=$(
            pahole --version |
            grep -oE '[0-9]+\.[0-9]+' |
            head -1
          )

          dpkg --compare-versions \
            "$PAHOLE_VERSION" ge 1.25

          echo "pahole >= 1.25 confirmed"

          python3 --version
          git --version

      # ======================================
      # 3. DOWNLOAD AOSP CLANG
      # ======================================

      - name: Download AOSP Clang r450784e
        shell: bash
        run: |
          set -euo pipefail

          CLANG_DIR="$RUNNER_TEMP/$CLANG_VERSION"
          ARCHIVE="$RUNNER_TEMP/$CLANG_VERSION.tar.gz"

          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$AOSP_CLANG_COMMIT/$CLANG_VERSION.tar.gz"

          echo "=================================="
          echo "Downloading AOSP Clang"
          echo "$CLANG_VERSION"
          echo "=================================="

          mkdir -p "$CLANG_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "$CLANG_URL" \
            --output "$ARCHIVE"

          echo "Checking archive..."

          tar -tzf "$ARCHIVE" >/dev/null

          echo "Extracting compiler..."

          tar -xzf "$ARCHIVE" \
            -C "$CLANG_DIR"

          echo "Checking compiler..."

          for tool in \
            clang \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-strip
          do
            if [ ! -e "$CLANG_DIR/bin/$tool" ]; then
              echo "::error::Missing LLVM binary: $tool"
              exit 1
            fi

            echo "[OK] $tool"
          done

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

          echo "Clang installed successfully"

          "$CLANG_DIR/bin/clang" --version

      # ======================================
      # 4. VERIFY TOOLCHAIN
      # ======================================

      - name: Verify Clang Toolchain
        shell: bash
        run: |
          set -euo pipefail

          test -x "$CLANG_DIR/bin/clang"

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-strip --version

          echo "LLVM toolchain ready"

      # ======================================
      # 5. VALIDATE SOURCE
      # ======================================

      - name: Validate Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "build/build.sh"
            "build/stock_defconfig"
            "build/stock-closed.symvers"
            "build/TESTED_MODULES.txt"
            "build/VERSIONS.txt"
            "kernel_platform/msm-kernel/Makefile"
            "kernel_platform/gki-stock/vmlinux.symvers"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing source: $file"
              exit 1
            fi

            echo "[OK] $file"
          done

          REQUIRED_DIRS=(
            "vendor/qcom/opensource"
            "vendor/xiaomi/opensource"
          )

          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing directory: $dir"
              exit 1
            fi

            echo "[OK] $dir"
          done

          echo "Source validation completed"

      # ======================================
      # 6. PREPARE BUILD
      # ======================================

      - name: Prepare Build Environment
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export STRIP=llvm-strip

          KERNEL="$GITHUB_WORKSPACE/kernel_platform/msm-kernel"
          GKI="$GITHUB_WORKSPACE/kernel_platform/gki-stock"

          rm -rf "$KERNEL/out"
          rm -rf "$GITHUB_WORKSPACE/out"

          # Remove generated BTF base only.
          # Preserve stock symvers and System.map.
          rm -f "$GKI/vmlinux"

          mkdir -p "$GITHUB_WORKSPACE/out"

          echo "Build environment ready"

      # ======================================
      # 7. BUILD KERNEL + ALL MODULES
      # ======================================

      - name: Build Kernel and Vendor Modules
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CLANG_DIR="$CLANG_DIR"
          export JOBS="$JOBS"

          export PATH="$CLANG_DIR/bin:$PATH"

          export OUT="$GITHUB_WORKSPACE/out"

          echo "=================================="
          echo "SAPPHIREN KERNEL BUILD"
          echo "=================================="

          echo "Device: sapphiren"
          echo "Compiler: clang-r450784e"
          echo "Jobs: $JOBS"

          echo "Starting original repository build script..."

          bash build/build.sh

          echo "=================================="
          echo "KERNEL AND MODULE BUILD COMPLETED"
          echo "=================================="

      # ======================================
      # 8. BUILD ANDROID KERNEL IMAGE
      # ======================================

      - name: Build ARM64 Image
        shell: bash
        run: |
          set -euo pipefail

          KERNEL="$GITHUB_WORKSPACE/kernel_platform/msm-kernel"

          export PATH="$CLANG_DIR/bin:$PATH"

          echo "Building ARM64 Image..."

          make \
            -j"$JOBS" \
            -C "$KERNEL" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-D__ANDROID_COMMON_KERNEL__ \
            Image

          IMAGE="$KERNEL/out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image was not generated"
            exit 1
          fi

          echo "Kernel Image successfully generated"

          ls -lh "$IMAGE"

      # ======================================
      # 9. VERIFY MODULE OUTPUT
      # ======================================

      - name: Verify Kernel Modules
        shell: bash
        run: |
          set -euo pipefail

          MODULE_DIR="$GITHUB_WORKSPACE/out"

          COUNT=$(find "$MODULE_DIR" \
            -maxdepth 1 -name '*.ko' | wc -l)

          echo "Built modules: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No modules were generated"
            exit 1
          fi

          find "$MODULE_DIR" \
            -maxdepth 1 \
            -name '*.ko' \
            -printf '%f\n' | sort

      # ======================================
      # 10. PREPARE ARTIFACTS
      # ======================================

      - name: Prepare Kernel Artifacts
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          KERNEL="$ROOT/kernel_platform/msm-kernel"
          DIST="$ROOT/dist"

          mkdir -p "$DIST/modules"

          # Kernel Image
          cp "$KERNEL/out/arch/arm64/boot/Image" \
            "$DIST/Image"

          # Kernel symbols
          if [ -f "$KERNEL/out/vmlinux" ]; then
            cp "$KERNEL/out/vmlinux" "$DIST/vmlinux"
          fi

          if [ -f "$KERNEL/out/System.map" ]; then
            cp "$KERNEL/out/System.map" "$DIST/System.map"
          fi

          if [ -f "$KERNEL/out/Module.symvers" ]; then
            cp "$KERNEL/out/Module.symvers" \
              "$DIST/Module.symvers"
          fi

          # Kernel config
          if [ -f "$KERNEL/out/.config" ]; then
            cp "$KERNEL/out/.config" \
              "$DIST/kernel.config"
          fi

          # Stock symbol reference
          cp "$ROOT/kernel_platform/gki-stock/vmlinux.symvers" \
            "$DIST/stock-vmlinux.symvers"

          # Device-tested modules
          cp "$ROOT/out/"*.ko "$DIST/modules/"

          # Module archive
          tar -czf "$DIST/modules.tar.gz" \
            -C "$DIST/modules" .

          # Build source information
          cp "$ROOT/build/TESTED_MODULES.txt" "$DIST/"
          cp "$ROOT/build/VERSIONS.txt" "$DIST/"

          # Build information
          {
            echo "Device: sapphiren"
            echo "Architecture: arm64"
            echo "Kernel tree: Linux 5.15.194"
            echo "Compiler: clang-r450784e"
            echo "KernelSU: disabled"
            echo "Branch: FirstKernel"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Build date: $(date -u)"
          } > "$DIST/BUILD_INFO.txt"

          echo "=================================="
          echo "FINAL OUTPUT"
          echo "=================================="

          find "$DIST" -maxdepth 2 -type f \
            -printf '%p (%k KB)\n'

      # ======================================
      # 11. UPLOAD ARTIFACTS
      # ======================================

      - name: Upload Sapphiren Custom Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Sapphiren-Custom-Kernel-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      # ======================================
      # 12. BUILD SUMMARY
      # ======================================

      - name: Build Summary
        if: always()
        run: |
          echo "# Sapphiren Custom Kernel" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Configuration | Value |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Device | sapphiren |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Architecture | ARM64 |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Kernel | 5.15.194 |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Clang | r450784e |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| KernelSU | Disabled |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Branch | FirstKernel |" \
            >> "$GITHUB_STEP_SUMMARY"
